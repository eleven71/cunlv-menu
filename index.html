<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>村驴菜谱库 🍳</title>
<style>
:root{
  --nav-bg:#2c3e50;
  --body-bg:#fafaf8;
  --card-bg:#ffffff;
  --text:#1a1a1a;
  --text-light:#6b6b6b;
  --border:#e8e6e0;
  --accent:#e67e22;
  --accent2:#e74c3c;
  --green:#27ae60;
  --blue:#2980b9;
  --purple:#8e44ad;
  --teal:#16a085;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--body-bg);color:var(--text);font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;line-height:1.6}
/* ===== 顶部导航 ===== */
.top-nav{background:var(--nav-bg);color:#fff;padding:18px 24px}
.top-nav h1{font-size:24px;color:#fff;letter-spacing:1px}
.top-nav h1 span{color:#f39c12}
.top-nav .subtitle{font-size:13px;color:#cfd8dc;margin-top:4px}
/* ===== 统计条 ===== */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:1100px;margin:20px auto 0;padding:0 20px}
.stat-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px 10px;text-align:center}
.stat-card .num{font-size:26px;font-weight:700}
.stat-card .label{font-size:12px;color:var(--text-light);margin-top:2px}
.stat-card:nth-child(1) .num{color:var(--accent2)}
.stat-card:nth-child(2) .num{color:var(--accent)}
.stat-card:nth-child(3) .num{color:var(--purple)}
/* ===== 工具条 ===== */
.toolbar{max-width:1100px;margin:16px auto 0;padding:0 20px;display:flex;gap:10px;flex-wrap:wrap}
#search{flex:1;min-width:240px;padding:12px 16px;font-size:15px;border:2px solid var(--border);border-radius:10px;background:#fff;color:var(--text);outline:none}
#search:focus{border-color:var(--accent)}
#search::placeholder{color:#999}
#random-btn{padding:12px 20px;font-size:15px;font-weight:700;background:var(--accent2);color:#fff;border:none;border-radius:10px;cursor:pointer;white-space:nowrap}
#random-btn:hover{background:#c0392b}
#fav-btn{padding:12px 20px;font-size:15px;font-weight:700;background:#fff;border:2px solid var(--border);border-radius:10px;cursor:pointer;color:var(--text);white-space:nowrap}
#fav-btn:hover{border-color:var(--accent2)}
#fav-btn.active{background:var(--accent2);border-color:var(--accent2);color:#fff}
#fridge-btn{padding:12px 20px;font-size:15px;font-weight:700;background:#fff;border:2px solid var(--border);border-radius:10px;cursor:pointer;color:var(--text);white-space:nowrap}
#fridge-btn:hover{border-color:var(--green)}
#fridge-btn.active{background:var(--green);border-color:var(--green);color:#fff}
/* 存储降级提示 */
#storage-warn{display:none;max-width:1100px;margin:12px auto 0;padding:10px 16px;font-size:13px;background:#fef9e7;border:1px solid #f3d9a4;border-radius:8px;color:#a8620a}
/* ===== 分类栏（三组） ===== */
.cat-area{max-width:1100px;margin:14px auto 0;padding:0 20px;display:flex;flex-direction:column;gap:8px}
.cat-group{display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap}
.cat-label{flex-shrink:0;font-size:12px;font-weight:700;color:#fff;background:var(--nav-bg);border-radius:4px;padding:5px 10px;margin-top:1px;letter-spacing:1px}
.cat-pills{display:flex;flex-wrap:wrap;gap:6px}
.cat-pill{padding:5px 12px;font-size:13px;background:#fff;border:1px solid var(--border);border-radius:20px;cursor:pointer;color:var(--text);user-select:none;transition:all .15s}
.cat-pill:hover{border-color:var(--accent);color:var(--accent)}
.cat-pill.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
/* ===== 结果区 ===== */
#result-info{max-width:1100px;margin:14px auto 0;padding:0 20px;font-size:13px;color:var(--text-light)}
.grid{max-width:1100px;margin:10px auto 40px;padding:0 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--card-bg);border:1px solid var(--border);border-radius:10px;padding:16px;cursor:pointer;transition:box-shadow .15s,transform .1s;display:flex;flex-direction:column;gap:8px;position:relative}
.card:hover{box-shadow:0 4px 14px rgba(0,0,0,.08);transform:translateY(-2px)}
.card h3{font-size:17px;color:var(--text);padding-right:26px}
.fav-star{position:absolute;top:12px;right:12px;font-size:20px;line-height:1;background:none;border:none;cursor:pointer;color:#cfcfcf;padding:2px;transition:color .15s;z-index:2}
.fav-star:hover{color:#f39c12}
.fav-star.on{color:#f1c40f}
.fav-star.on:hover{color:#f39c12}
.card .desc{font-size:13px;color:var(--text-light);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{font-size:12px;color:var(--text-light);display:flex;gap:12px}
.card .tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:auto}
.tag{font-size:11px;padding:2px 8px;border-radius:4px;color:#fff;background:var(--green)}
.tag.t0{background:var(--accent2)}
.tag.t1{background:var(--accent)}
.tag.t2{background:var(--green)}
.tag.t3{background:var(--blue)}
.tag.t4{background:var(--purple)}
.tag.t5{background:var(--teal)}
#empty{display:none;text-align:center;color:var(--text-light);padding:60px 20px;font-size:15px}
/* ===== 详情弹窗 ===== */
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;overflow-y:auto;padding:30px 16px}
#overlay.show{display:block}
#modal{background:#fff;max-width:760px;margin:0 auto;border-radius:12px;padding:26px 30px;position:relative;color:var(--text)}
#modal h2{font-size:22px;color:var(--text);padding-right:40px}
#modal .m-desc{font-size:14px;color:var(--text-light);margin:6px 0 14px}
#modal .m-meta{font-size:12px;color:var(--text-light);margin-bottom:14px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
#fav-modal-btn{padding:5px 14px;font-size:12px;border:1px solid var(--border);border-radius:16px;background:#fff;color:var(--text);cursor:pointer;font-weight:700}
#fav-modal-btn.on{background:#f1c40f;border-color:#f1c40f;color:#fff}
#close-btn{position:absolute;top:14px;right:16px;background:var(--nav-bg);color:#fff;border:none;width:32px;height:32px;border-radius:50%;font-size:16px;cursor:pointer;line-height:1}
#close-btn:hover{background:#1a252f}
.m-section{margin-top:18px}
.m-section h4{font-size:15px;color:var(--nav-bg);border-left:4px solid var(--accent);padding-left:8px;margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border:1px solid var(--border);padding:8px 10px;text-align:left;vertical-align:top}
th{background:#f4f3ef;color:var(--text);font-weight:700}
td:first-child{width:28%}
td:nth-child(2){width:20%}
td .orig{font-size:11px;color:#999;margin-left:4px}
.sub-alt{display:inline-block;margin-top:4px;font-size:12px;background:#eef7ff;border:1px solid #bcd9f2;color:#1a5276;border-radius:4px;padding:3px 8px}
.step-item{display:flex;gap:12px;margin-bottom:12px}
.step-num{flex-shrink:0;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.step-body{font-size:14px}
.step-tip{margin-top:4px;font-size:12px;color:#a8620a;background:#fef9e7;border:1px solid #f3d9a4;border-radius:6px;padding:6px 10px}
.tips-box{background:#fef9e7;border:1px solid #f3d9a4;border-radius:8px;padding:12px 14px;font-size:13px}
.tips-box ul{margin-left:18px}
.video-link{display:inline-block;margin-top:14px;padding:10px 18px;background:var(--blue);color:#fff;text-decoration:none;border-radius:8px;font-size:14px;font-weight:700}
.video-link:hover{background:#1f618d}
/* ===== 份量选择器 ===== */
.portion{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;padding:10px 14px;background:#f4f3ef;border:1px solid var(--border);border-radius:8px}
.portion .p-label{font-size:13px;font-weight:700;color:var(--text)}
.portion .p-hint{font-size:12px;color:var(--text-light)}
.portion .p-btn{padding:5px 14px;font-size:13px;border:1px solid var(--border);border-radius:16px;background:#fff;cursor:pointer;color:var(--text)}
.portion .p-btn.active{background:var(--green);border-color:var(--green);color:#fff;font-weight:700}
.portion .p-btn:hover{border-color:var(--green)}
/* ===== 冰箱选材面板 ===== */
.fridge-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.fridge-head h3{font-size:18px;color:var(--text)}
.staple-toggle{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;user-select:none;background:#f4f3ef;border:1px solid var(--border);border-radius:16px;padding:6px 14px;color:var(--text)}
.staple-toggle input{accent-color:var(--green);width:15px;height:15px;cursor:pointer}
.fridge-input-wrap{display:flex;gap:8px;margin-bottom:12px}
#fridge-input{flex:1;padding:10px 14px;font-size:14px;border:2px solid var(--border);border-radius:8px;background:#fff;color:var(--text);outline:none}
#fridge-input:focus{border-color:var(--green)}
#fridge-input::placeholder{color:#999}
.fridge-suggest{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 10px}
.fridge-suggest .sug{font-size:12px;background:#eef7ff;border:1px solid #bcd9f2;color:#1a5276;border-radius:12px;padding:3px 10px;cursor:pointer}
.fridge-suggest .sug:hover{background:#d9ecfb}
.fridge-picked{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.fridge-picked .chip{font-size:13px;background:var(--green);color:#fff;border-radius:14px;padding:4px 12px;cursor:pointer}
.fridge-picked .chip:hover{background:#1e8449}
.fridge-groups{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.fg-title{font-size:13px;font-weight:700;color:var(--nav-bg);margin-bottom:4px}
.fg-btns{display:flex;flex-wrap:wrap;gap:6px}
.ing-chip{font-size:13px;background:#fff;border:1px solid var(--border);border-radius:14px;padding:4px 12px;cursor:pointer;color:var(--text);user-select:none;transition:all .12s}
.ing-chip:hover{border-color:var(--green);color:var(--green)}
.ing-chip.on{background:var(--green);border-color:var(--green);color:#fff;font-weight:700}
#fridge-go{padding:11px 0;width:100%;font-size:15px;font-weight:700;background:var(--green);color:#fff;border:none;border-radius:8px;cursor:pointer}
#fridge-go:hover{background:#1e8449}
.fridge-results{margin-top:16px}
.fr-group-title{font-size:14px;font-weight:700;margin:12px 0 8px;padding-left:8px;border-left:4px solid var(--accent);color:var(--text)}
.fr-group-title.full{border-color:var(--green)}
.fr-group-title.miss1{border-color:var(--accent)}
.fr-group-title.miss2{border-color:#95a5a6}
.fr-card{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff;border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin-bottom:8px;cursor:pointer}
.fr-card:hover{box-shadow:0 2px 8px rgba(0,0,0,.07)}
.fr-card .name{font-size:14px;font-weight:700;color:var(--text)}
.fr-card .miss{font-size:12px;color:var(--text-light)}
.fr-card .miss b{color:#c0392b;font-weight:700}
.fr-card .go{font-size:12px;color:var(--blue)}
#fridge-hint{font-size:12px;color:var(--text-light);margin-top:8px}
footer{max-width:1100px;margin:0 auto 30px;padding:0 20px;font-size:12px;color:var(--text-light);text-align:center}
@media (max-width:640px){
  .stats{grid-template-columns:repeat(3,1fr);gap:8px;padding:0 10px}
  .grid{padding:0 10px;grid-template-columns:1fr}
  .toolbar,.cat-area{padding:0 10px}
  #modal{padding:18px 14px}
}
</style>
</head>
<body>

<div class="top-nav">
  <h1>🍳 村驴菜谱库 <span>·</span> 做饭届博士生导师</h1>
  <div class="subtitle">保姆级美食教程 · 食材精确到克 · 跟着做不翻车</div>
</div>

<div class="stats">
  <div class="stat-card"><div class="num" id="stat-recipes">0</div><div class="label">收录菜谱</div></div>
  <div class="stat-card"><div class="num" id="stat-ing">0</div><div class="label">食材种类</div></div>
  <div class="stat-card"><div class="num" id="stat-tags">0</div><div class="label">风味标签</div></div>
</div>

<div class="toolbar">
  <input type="text" id="search" placeholder="🔍 搜菜名 / 食材 / 标签，比如：鸡胸肉、酸辣、蒸菜、红烧…">
  <button id="random-btn">🎲 今天吃什么</button>
  <button id="fav-btn">❤️ 我的收藏 (0)</button>
  <button id="fridge-btn">🧊 冰箱选材</button>
</div>

<div id="storage-warn">⚠️ 当前浏览器禁用了本地存储，收藏只能保留到本次关闭网页前。建议用右下角「导出收藏」保存到文件。</div>

<div class="cat-area">
  <div class="cat-group"><span class="cat-label">荤素</span><div class="cat-pills" id="cats-meat"></div></div>
  <div class="cat-group"><span class="cat-label">食材</span><div class="cat-pills" id="cats-ing"></div></div>
  <div class="cat-group"><span class="cat-label">做法</span><div class="cat-pills" id="cats-method"></div></div>
</div>

<div id="result-info"></div>
<div class="grid" id="grid"></div>
<div id="empty">😶 没有找到匹配的菜，换个关键词试试～</div>

<div id="overlay">
  <div id="modal"></div>
</div>

<footer>
  数据来源：<a href="https://github.com/Ryder-MHumble/Cunlv-Skill" style="color:var(--blue)">Ryder-MHumble/Cunlv-Skill</a>（MIT）· 教程版权归 <a href="https://space.bilibili.com/417298480" style="color:var(--blue)">B站UP主 村驴</a> 所有 · 仅供个人学习
  <br>收藏备份：<a href="#" id="fav-export" style="color:var(--blue)">导出收藏</a> · <a href="#" id="fav-import" style="color:var(--blue)">导入收藏</a>
</footer>
<input type="file" id="fav-file" accept=".json,application/json" style="display:none">

<script src="data/recipes.js"></script>
<script>
(function(){
  'use strict';
  var RECIPES = window.RECIPES || [];
  var TAG_COLORS = ['t0','t1','t2','t3','t4','t5'];

  /* ==================== 分类体系（三组维度） ==================== */
  // 荤素组
  var MEAT_CATS = [
    {name:'全部', test:null},
    {name:'🥩 荤菜', test:function(r){return isMeat(r)}},
    {name:'🥬 素菜', test:function(r){return !isMeat(r)}}
  ];
  // 调料类误伤排除（含关键词但不是主料的食材）
  var IGNORE_KWS = ['蒸鱼豉油','木鱼花','鲣鱼粉','鱼露','虾皮','虾米','开洋'];
  function isIgnored(name){return IGNORE_KWS.some(function(k){return name.indexOf(k)>=0});}
  // 食材组（多归属：一道菜可同时属于多类，如干烧鱼=鱼+猪肉配菜）
  var ING_CATS = [
    {name:'全部', kws:null},
    {name:'🥚 蛋类', kws:['鸡蛋','鸭蛋','鹌鹑蛋','皮蛋','咸蛋','蛋黄','蛋清']},
    {name:'🍖 内脏', kws:['猪肝','腰花','肥肠','猪肚','毛肚','黄喉','鸡胗','鸡肝','鸭肠','猪心','猪血','牛杂','羊杂','猪腰']},
    {name:'🐟 鱼', kws:['鱼','鲈鱼','带鱼','鲫鱼','鲤鱼','草鱼','熏鱼','鱼片','鱼头','鳕鱼','巴沙鱼','龙利鱼','黑鱼','黄鱼','泥鳅','鳝鱼','鳗鱼','银鱼','多宝鱼','鲅鱼','鳜鱼','鲮鱼','鲶鱼','台鲅鱼']},
    {name:'🦐 虾蟹贝', kws:['鱿鱼','大虾','活虾','基围虾','虾仁','虾滑','皮皮虾','龙虾','海虹','螃蟹','蟹','花甲','花蛤','蛏子','生蚝','扇贝','鲍鱼','海参','蛤蜊','八爪鱼','章鱼','海螺','干贝','瑶柱']},
    {name:'🐂 牛羊肉', kws:['羊肉','牛肉','牛腩','牛腱','牛排','肥牛','牛骨','牛肋','羊排','羊蝎子','羊腿','羊骨']},
    {name:'🐔 鸡鸭', kws:['鸡腿','鸡翅','鸡肉','鸡胸','鸡爪','鸡架','三黄鸡','童子鸡','土鸡','鸡脖','鸡排','鸡柳','鸡皮','鸭肉','鸭腿','鸭翅','鸭架','鸭血','老鸭','烤鸭','鸭脖','鸡全翅','鸡中翅']},
    {name:'🐷 猪肉', kws:['五花肉','猪肉','排骨','里脊','猪蹄','猪皮','腊肠','火腿','肉末','瘦肉','肥肉','梅花肉','前腿','后腿','肉馅','香肠','肘子','培根','叉烧','护心肉','肉片','肉丝']},
    {name:'🫘 豆制品', kws:['豆腐','豆干','豆皮','腐竹','豆泡','千张','豆浆','豆腐脑','素鸡','香干','干豆腐','冻豆腐','油豆腐']},
    {name:'🍚 米面主食', kws:['面粉','面条','挂面','意面','米粉','河粉','凉皮','米饭','糯米','大米','馒头','包子','饺子','馄饨','饼','面包','年糕','粉丝','粉条','拉面','花卷','烧饼','油条','窝头','玉米面','燕麦','糙米','小米','面皮','面片','通心粉']}
  ];
  // 做法组
  var METHOD_CATS = [
    {name:'全部', kws:null},
    {name:'🍳 炒', kws:['炒']},
    {name:'🥘 炖焖', kws:['炖','红烧','焖','煨','卤','酱烧']},
    {name:'♨️ 蒸', kws:['蒸']},
    {name:'🍤 炸', kws:['炸','酥脆']},
    {name:'🥗 凉拌', kws:['凉拌','凉菜','拌','腌']},
    {name:'🍲 汤煲', kws:['汤','煲','砂锅','粥','羹']},
    {name:'🍗 空气炸锅', kws:['空气炸锅','烤箱','烤']},
    {name:'🥟 面点', kws:['面食','包子','饺子','饼','馒头','花卷','油条','烧饼','馄饨','馅饼']}
  ];

  // 荤素判定：食材命中肉/蛋类关键词即荤（米面主食、调料类不算）
  function isMeat(r){
    return ingCats(r).some(function(i){return i !== ING_CATS.length-1});
  }
  // 食材组判定（多归属）：返回命中的所有食材类别下标（米面主食除外）
  function ingCats(r){
    var res = [];
    var names = (r.ingredients||[]).map(function(x){return x.name||''});
    for(var i=1;i<ING_CATS.length;i++){
      var hit = names.some(function(n){
        if(isIgnored(n)) return false;
        return ING_CATS[i].kws.some(function(k){return n.indexOf(k)>=0});
      });
      if(hit) res.push(i);
    }
    return res;
  }
  // 做法判定：tags + 菜名
  function methodCat(r){
    var hay = (r.tags||[]).concat([r.dish_name||'']);
    for(var i=1;i<METHOD_CATS.length;i++){
      var hit = hay.some(function(h){return METHOD_CATS[i].kws.some(function(k){return h.indexOf(k)>=0})});
      if(hit) return i;
    }
    return 0;
  }

  /* ==================== 材料替代库 ==================== */

  var CN_NUM = {'一':1,'二':2,'两':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10,'半':0.5};
  function bestFrac(n){
    if(n<0.02) return '0';
    var cands=[[1,2],[1,3],[2,3],[1,4],[3,4],[1,5],[2,5],[3,5],[4,5],[1,6],[5,6],[1,8],[3,8],[5,8],[7,8],[1,10],[3,10],[7,10],[9,10]];
    for(var i=0;i<cands.length;i++){
      if(Math.abs(n-cands[i][0]/cands[i][1])<0.03) return cands[i][0]+'/'+cands[i][1];
    }
    return null;
  }
  function fmtNum(n){
    var r=Math.round(n*100)/100;
    if(Number.isInteger(r)) return String(r);
    var f=bestFrac(r);
    return f?f:String(r);
  }
  function scaleAmount(amount, factor){
    if(!amount) return '';
    if(factor===1) return amount;
    var s=amount.replace(/[零一二三四五六七八九十两半]/g,function(c){return CN_NUM[c]!==undefined?String(CN_NUM[c]):c;});
    s=s.replace(/(\d+)\s*\/\s*(\d+)/g,function(m,a,b){return fmtNum(parseFloat(a)/parseFloat(b)*factor);});
    s=s.replace(/(\d+(?:\.\d+)?)/g,function(m){return fmtNum(parseFloat(m)*factor);});
    return s;
  }

    }).join('');
    var tipsHtml=(r.tips&&r.tips.length)?
      '<div class="m-section"><h4>⚠️ 村驴的叮嘱</h4><div class="tips-box"><ul>'+
      r.tips.map(function(t){return '<li>'+esc(t)+'</li>'}).join('')+'</ul></div></div>':'';
    var video=r.video_url?'<a class="video-link" href="'+esc(r.video_url)+'" target="_blank">▶️ 看原视频教程</a>':'';
    m.innerHTML=
      '<button id="close-btn" onclick="document.getElementById(\'overlay\').classList.remove(\'show\')">✕</button>'+
      '<h2>'+esc(r.dish_name)+'</h2>'+
      '<div class="m-desc">'+esc(r.description)+'</div>'+
      '<div class="m-meta">'+(r.pub_date?'📅 发布 '+esc(r.pub_date):'')+(r.duration?' · ⏱️ '+Math.round(r.duration/60)+'分钟':'')+
      ' <button id="fav-modal-btn" class="'+(isFav(r.dish_name)?'on':'')+'">'+(isFav(r.dish_name)?'★ 已收藏':'☆ 收藏')+'</button></div>'+
      '<div class="m-section"><h4>📋 食材准备</h4>'+
      '<div class="portion"><span class="p-label">🍽️ 份量</span>'+
      portionBtns+'<span class="p-hint">按比例自动换算用量（1倍=村驴原配方，约2-3人份）</span></div>'+
      '<table style="margin-top:10px"><tr><th>食材</th><th>用量</th><th>备注</th></tr>'+ingRows+'</table></div>'+
      '<div class="m-section"><h4>👩‍🍳 做法步骤</h4>'+stepHtml+'</div>'+
      tipsHtml+video;
    // 份量按钮事件
    m.querySelectorAll('.p-btn').forEach(function(btn){
      btn.addEventListener('click',function(){
        state.portion=parseFloat(btn.getAttribute('data-f'));
        openModal(r);
      });
    });
    // 收藏按钮事件
    m.querySelector('#fav-modal-btn').addEventListener('click',function(){
      toggleFav(r.dish_name);
      var b=m.querySelector('#fav-modal-btn');
      b.textContent=isFav(r.dish_name)?'★ 已收藏':'☆ 收藏';
      b.classList.toggle('on',isFav(r.dish_name));
      render();
    });
    document.getElementById('overlay').classList.add('show');
    document.getElementById('overlay').scrollTop=0;
  }

  // 搜索（防抖）
  var searchEl=document.getElementById('search'),timer=null;
  searchEl.addEventListener('input',function(){
    clearTimeout(timer);
    timer=setTimeout(function(){state.kw=searchEl.value.trim();render();},150);
  });

  // 随机推荐
  document.getElementById('random-btn').addEventListener('click',function(){
    var list=RECIPES.filter(matchAll);
    if(!list.length) return;
    openModal(list[Math.floor(Math.random()*list.length)]);
  });

  // 点遮罩关闭
  document.getElementById('overlay').addEventListener('click',function(e){
    if(e.target===this) this.classList.remove('show');
  });

  render();
  updateFavBtn();
})();
</script>
</body>
</html>
